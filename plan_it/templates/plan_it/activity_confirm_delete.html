{% extends "plan_it/base.html" %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">Delete Activity</h1>

    <div class="alert alert-warning">
        <strong>Are you sure you want to delete:</strong> {{ object }}?
    </div>

    <form method="post">
        {% csrf_token %}
        <a href="{% url 'plan_it:activity_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
    </form>
</div>
{% endblock %}
