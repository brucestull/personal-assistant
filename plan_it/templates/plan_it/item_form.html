{% extends "plan_it/adhd_base.html" %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">{{ view.object|default:"Add" }} Item</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <a href="{% url 'plan_it:item_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
{% endblock %}
