{% extends "plan_it/base.html" %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">
        {% if view.object %}
            Edit {{ view.model._meta.verbose_name|title }}
        {% else %}
            Add {{ view.model._meta.verbose_name|title }}
        {% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <a href="{{ view.model.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
{% endblock %}
