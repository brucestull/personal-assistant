{% extends "base.html" %}

{% block title %}
    Activities
{% endblock title%}

{% block content %}
  <h1>Activities</h1>
  <a href="{% url 'care_craft:activity_create' %}">+ Add New Activity</a>
  <ul>
    {% for activity in activities %}
      <li>
        <h2>{{ activity.description }}</h2>
        <a href="{% url 'care_craft:activity_detail' activity.pk %}">Edit</a>
        <hr>
      </li>
    {% empty %}
      <li>No activities available.</li>
    {% endfor %}
  </ul>
{% endblock %}
