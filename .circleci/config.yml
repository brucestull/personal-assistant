# Python CircleCI 2.0 configuration file
version: 2.1
jobs:
  build_and_test:
    docker:
      - image: cimg/python:3.11.5
    parallelism: 3

    environment:
      # Keep the venv inside the repo so CircleCI caching is easy.
      PIPENV_VENV_IN_PROJECT: "true"
      # Make settings deterministic in CI.
      ENVIRONMENT: "test"
      DJANGO_SETTINGS_MODULE: "config.settings"
      CELERY_TASK_ALWAYS_EAGER: "true"

    working_directory: ~/repo

    steps:
      # Step 1: obtain repo from GitHub
      - checkout

      - restore_cache:
          keys:
            - pipenv-v1-{{ checksum "Pipfile.lock" }}
            - pipenv-v1-

      # Step 2: create virtual env and install dependencies
      - run:
          name: Install Dependencies
          command: |
            # optional but nice: make sure pip/pipenv are up to date
            python -m pip install --upgrade pip
            pip install pipenv

            # Cache-friendly install (uses Pipfile.lock)
            pipenv install --dev --deploy

      - save_cache:
          key: pipenv-v1-{{ checksum "Pipfile.lock" }}
          paths:
            - .venv
            - ~/.cache/pip

      # Step 3: run linter
      - run:
          name: Run Linter
          command: |
            pipenv run flake8

      # Step 4: run tests and coverage
      - run:
          name: Run Tests and Coverage
          command: |
            mkdir -p test-results

            # Split tests across parallel containers (file-level split).
            TEST_FILES=$(circleci tests glob \
              "**/tests/test_*.py" \
              "**/tests/*_tests.py" \
              "**/tests.py" \
              "tests/test_*.py" \
              | circleci tests split --split-by=timings)

            # Run *all* pytest + Django TestCase tests via pytest-django.
            # coverage config comes from .coveragerc / pyproject.
            pipenv run coverage run -m pytest \
              --junitxml=test-results/pytest.xml \
              $TEST_FILES

            pipenv run coverage report

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results

  deploy:
    docker:
      - image: cimg/python:3.11.5
    steps:
      # Step 5: obtain repo from GitHub
      - checkout
      # Step 6: Install Heroku CLI
      - run:
          name: Install Heroku CLI
          command: |
            curl https://cli-assets.heroku.com/install.sh | sh
          when: on_success

      # Step 7: Authenticate with Heroku
      - run:
          name: Authenticate with Heroku
          command: echo $HEROKU_API_KEY | heroku auth:token
          when: on_success

      # Step 8: Deploy to Heroku
      - run:
          name: Deploy to Heroku
          command: |
            git push https://heroku:$HEROKU_API_KEY@git.heroku.com/flynnt-knapp.git $CIRCLE_SHA1:refs/heads/master
          when: on_success
      # Step 9: Ensure Celery worker is running
      - run:
          name: Ensure Celery Worker Is Running
          command: |
            heroku ps:scale worker=1 --app flynnt-knapp
          when: on_success

workflows:
  version: 2
  build_then_deploy:
    jobs:
      - build_and_test
      - deploy:
          requires:
            - build_and_test
          filters:
            branches:
              only: main
