# Python CircleCI 2.0 configuration file
version: 2
jobs:
  build:
    docker:
      - image: cimg/python:3.11.5
    parallelism: 3

    working_directory: ~/repo

    steps:
      # Step 1: obtain repo from GitHub
      - checkout
      
      # Step 2: create virtual env and install dependencies
      - run:
          name: install dependencies
          command: |
            pipenv install
            
      # Step 3: run linter and tests
      - run:
          name: run linter
          command: |
            pipenv run flake8 --exclude=migrations,common.py,wsgi.py,manage.py --ignore=F403,F405 --statistics
            
      # Step 4: run tests and coverage
      - run:
          name: run tests and coverage
          command: |
            pipenv run coverage run --source='.' --omit="*/asgi.py,*/wsgi.py,*/manage.py" ./manage.py test
            pipenv run coverage report

      # Step 5: Install Heroku CLI
      - run:
          name: Install Heroku CLI
          command: |
            curl https://cli-assets.heroku.com/install.sh | sh

      # Step 6: Authenticate with Heroku
      - run:
          name: Authenticate with Heroku
          command: echo $HEROKU_API_KEY | heroku auth:token

      # Step 7: Deploy to Heroku
      - run:
          name: Deploy to Heroku
          command: |
            git push https://heroku:$HEROKU_API_KEY@git.heroku.com/flynnt-knapp.git $CIRCLE_SHA1:refs/heads/master

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
