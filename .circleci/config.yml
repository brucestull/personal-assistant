version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11.5
      - image: heroku/cli
    parallelism: 3

    working_directory: ~/repo

    steps:
      # Step 1: log in to Docker Hub
      - run:
          name: log in to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      # Step 2: obtain repo from GitHub
      - checkout
      # Step 3: create virtual env and install dependencies
      - run:
          name: install dependencies
          command: |
            pipenv install
      # Step 4: run linter
      - run:
          name: run linter
          command: |
            pipenv run flake8 --exclude=migrations,common.py,wsgi.py,manage.py --ignore=F403,F405 --statistics
      # Step 5: run tests and coverage
      - run:
          name: run tests and coverage
          command: |
            pipenv run coverage run --source='.' ./manage.py test
            pipenv run coverage report
      # Step 6: deploy to Heroku
      - deploy:
          name: deploy to Heroku
          command: |
            heroku login -i
            heroku git:remote -a flynnt-knapp
            git push heroku main
