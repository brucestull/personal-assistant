{% extends "base.html" %}

{% block content %}
  <h1>{% if object %}Edit{% else %}Create{% endif %} Story Line Note</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <a href="{% url 'story_line:note_list' %}">Cancel</a>
{% endblock %}
