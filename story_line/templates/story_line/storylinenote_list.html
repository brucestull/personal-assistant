{% extends "base.html" %}

{% block content %}
  <h1>My Story Line Notes</h1>
  <a href="{% url 'story_line:note_create' %}">Create New Note</a>
  <ul>
    {% for note in notes %}
      <li>
        <a href="{{ note.get_absolute_url }}">{{ note.title }}</a> - {{ note.created|date:"Y-m-d H:i" }}
      </li>
    {% empty %}
      <li>No notes yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
