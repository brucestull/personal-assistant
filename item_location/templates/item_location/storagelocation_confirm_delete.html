{% extends "base.html" %}

{% block title %}{{ the_site_name }} - {{ page_title }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 500px;">
  <h1 class="h3 mb-4">Delete Storage Location</h1>
  <div class="alert alert-warning">
    Are you sure you want to delete <strong>{{ object.name }}</strong>?
    Items stored here will have their location cleared.
  </div>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
