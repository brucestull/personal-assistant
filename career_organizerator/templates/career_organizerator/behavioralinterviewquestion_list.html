{% extends "base.html" %}

{% block title %}
    {{ the_site_name }}
    -
    {{ page_title }}
{% endblock title %}

{% block content %}
<h1>{{ page_title }}</h1>

<form method="post" action="/career-organizerator/behavioral-interview-questions/">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Behavioral Interview Question</button>
</form>

{% for question in behavioralinterviewquestion_list %}
    <p>{{ question.text }}</p>
{% endfor %}

{% endblock content %}
