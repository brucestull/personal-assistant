{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h1>{% if object %}Edit{% else %}New{% endif %} Priority</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'tasks:priority_list' %}" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
