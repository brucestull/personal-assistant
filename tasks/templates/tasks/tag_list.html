{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h1>Tags</h1>
  <a href="{% url 'tasks:tag_create' %}" class="btn btn-primary mb-3">+ Add Tag</a>
  <ul class="list-group">
    {% for tag in object_list %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'tasks:tag_detail' tag.pk %}">{{ tag.name }} - ({{ tag.tasks.count }} Tasks)</a>
        <div>
          <a href="{% url 'tasks:tag_update' tag.pk %}" class="btn btn-sm btn-secondary">Edit</a>
          <a href="{% url 'tasks:tag_delete' tag.pk %}" class="btn btn-sm btn-danger">Delete</a>
        </div>
      </li>
    {% empty %}
      <li class="list-group-item">No tags yet.</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
