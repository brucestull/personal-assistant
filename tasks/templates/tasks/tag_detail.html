{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h1>{{ object.name }}</h1>
  <p>{{ object.description|linebreaks }}</p>
  <a href="{% url 'tasks:tag_update' object.pk %}" class="btn btn-secondary">Edit</a>
  <a href="{% url 'tasks:tag_delete' object.pk %}" class="btn btn-danger">Delete</a>
  <a href="{% url 'tasks:tag_list' %}" class="btn btn-link">← Back to list</a>
</div>
{% endblock %}
