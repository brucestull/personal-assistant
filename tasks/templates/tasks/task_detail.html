{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  {% for tag in object.tag.all %}
    <span class="badge bg-primary">
      <a href="{% url 'tasks:tag_detail' tag.pk %}" class="text-white text-decoration-none">
        #{{ tag.name }}
      </a>
    </span>
  {% empty %}
    <span class="text-muted">no tags</span>
  {% endfor %}

  <h1>{{ object.name }}</h1>
  <p>{{ object.information|linebreaks }}</p>
  <a href="{% url 'tasks:task_update' object.pk %}" class="btn btn-secondary">Edit</a>
  <a href="{% url 'tasks:task_delete' object.pk %}" class="btn btn-danger">Delete</a>
  <a href="{% url 'tasks:task_list' %}" class="btn btn-link">← Back to list</a>
</div>
{% endblock %}
