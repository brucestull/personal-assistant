# pyproject.toml
# Tooling config for this Django repo.
# Note: flake8 does NOT read pyproject.toml by default,
# so keep your existing .flake8 for flake8 settings.

[tool.black]
line-length = 88
target-version = ["py311"]
# Black uses regex for excludes. This skips any folder named "migrations"
# plus common virtualenv/build/artifact dirs.
extend-exclude = '''
/migrations/
|/.venv/
|/venv/
|/node_modules/
|/staticfiles/
|/media/
|/build/
|/dist/
|/htmlcov/
|/\.git/
'''

[tool.isort]
profile = "black"
line_length = 88
# isort uses globs. Skip migrations and common junk dirs.
skip_glob = [
  "**/migrations/*.py",
  "**/.venv/**",
  "**/venv/**",
  "**/node_modules/**",
  "**/staticfiles/**",
  "**/media/**",
  "**/build/**",
  "**/dist/**",
  "**/htmlcov/**",
  "**/.git/**",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  "**/migrations/**",
  ".venv",
  "venv",
  "node_modules",
  "staticfiles",
  "media",
  "build",
  "dist",
  "htmlcov",
  ".git",
]

# A solid default ruleset for Django/Python projects.
# E/F/W = pycodestyle/pyflakes warnings
# I = import sorting (ruff replaces isort checks)
# B = bugbear (good correctness checks)
# UP = pyupgrade (modernize Python)
select = ["E", "F", "W", "I", "B", "UP"]

# Let Black own formatting edges:
ignore = ["E203", "W503"]

# Allow autofix when running `ruff --fix`
fixable = ["ALL"]
unfixable = []

[tool.ruff.per-file-ignores]
# If any migrations slip through (custom paths), ignore unused-import etc.
"**/migrations/*.py" = ["F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

# mypy exclude is regex-ish matched on paths
exclude = [
  "migrations",
  "\\.venv",
  "^venv/",
  "node_modules",
  "staticfiles",
  "media",
  "build",
  "dist",
  "htmlcov",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = [
  "tests.py",
  "test_*.py",
  "*_tests.py",
]
addopts = "-ra"
testpaths = ["."]
norecursedirs = [
  ".*",
  "migrations",
  "node_modules",
  "staticfiles",
  "media",
  "build",
  "dist",
  "htmlcov",
  ".venv",
  "venv",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/.venv/*",
  "*/venv/*",
  "*/node_modules/*",
  "*/staticfiles/*",
  "*/media/*",
  "*/build/*",
  "*/dist/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self\\.debug",
  "if settings\\.DEBUG",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
