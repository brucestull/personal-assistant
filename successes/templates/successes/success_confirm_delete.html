{% extends 'base.html' %}

{% block title %}{{ page_title }} - {{ the_site_name }}{% endblock %}

{% block content %}
<div class="container py-4">
  <h1>Delete Success</h1>
  
  <div class="card border-danger">
    <div class="card-body">
      <h5 class="card-title text-danger">Are you sure?</h5>
      <p class="card-text">Are you sure you want to delete this success?</p>
      <div class="alert alert-warning">
        <p class="mb-0">{{ object.text|truncatewords:50 }}</p>
      </div>
      
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'successes:success_list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
