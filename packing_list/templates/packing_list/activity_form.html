{% extends "base.html" %}

{% block title %}
{{ page_title }}
-
{{ the_site_name }}
{% endblock title %}

{% block content %}
<h1>{{ page_title }}</h1>
<form method="post" class="needs-validation" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'packing_list:activity_list' %}" class="btn btn-secondary">Cancel</a>
</form>
<p class="mt-3">
    <a href="{% url 'packing_list:item_list' %}">View all Items</a> |
    <a href="{% url 'packing_list:task_list' %}">View all Tasks</a>
</p>
{% endblock content %}
