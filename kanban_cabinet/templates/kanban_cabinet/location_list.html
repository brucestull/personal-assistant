{% extends "base.html" %}
{% block content %}
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3">Locations</h1>
    <a class="btn btn-primary" href="{% url 'kanban_cabinet:location_create' %}">Add location</a>
  </div>

  <div class="table-responsive">
    <table class="table table-sm table-striped align-middle">
      <thead>
        <tr>
          <th>Name</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody>
        {% for location in object_list %}
          <tr>
            <td>
              <a href="{% url 'kanban_cabinet:location_detail' location.pk %}">
                {{ location.name }}
              </a>
            </td>
            <td>
              {% if location.is_active %}
                <span class="badge bg-success">Yes</span>
              {% else %}
                <span class="badge bg-secondary">No</span>
              {% endif %}
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="2" class="text-muted">No locations yet.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
