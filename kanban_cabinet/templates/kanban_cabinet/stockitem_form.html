{% extends "base.html" %}
{% block content %}
<div class="container py-3">
  <h1 class="h3 mb-3">
    {% if object %}Edit item{% else %}Add item{% endif %}
  </h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</div>
{% endblock %}
