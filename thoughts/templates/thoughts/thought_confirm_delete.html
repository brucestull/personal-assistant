{% extends "base.html" %}

{% block title %}{{ the_site_name }} - {{ page_title }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h3 mb-0">{{ page_title }}</h1>
    <a href="{% url 'thoughts:thought-list' %}" class="btn btn-outline-secondary">
      Cancel
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-danger">
        <div class="card-body">
          <p class="card-text">Are you sure you want to delete this thought?</p>
          <blockquote class="blockquote">
            <p class="mb-0 text-muted">{{ object.text }}</p>
          </blockquote>
          <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-danger">Yes, Delete</button>
              <a href="{% url 'thoughts:thought-list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
