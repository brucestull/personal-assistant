{% extends "base.html" %}

{% block title %}
    {{ page_title }}
    -
    {{ the_site_name }}
{% endblock title %}

{% block content %}
    <h1>{{ page_title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add/Save Unimportant Note</button>
        {% if unimportantnote %}
            <a href={% url 'unimportant_notes:note_list' %}>
                Cancel
            </a>
        {% endif %}
    </form>

{% endblock content %}
