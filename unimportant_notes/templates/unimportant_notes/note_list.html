<title>{{ user.username }}'s Notes</title>

<h1>Notes</h1>
{% for object in object_list %}
    <h2>{{ object.title }}</h2>
    {{ object.content|linebreaks }}
    - {{ object.author }} on {{ object.updated }}
    {% if not forloop.last %}
        <br>
    {% endif %}
{% endfor %}

<h2>Add a Note</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Add">
</form>
