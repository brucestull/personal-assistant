{% extends "base.html" %}

{% block title %}
    {{ page_title }}
    -
    {{ the_site_name }}
{% endblock title %}

{% block content %}
    <h1>{{ notetag.name }} Notes</h1>
    {% for note in notetag.unimportant_notes.all %}
        <h2>{{ note.title }}</h2>
        <a href={% url "unimportant_notes:note_detail" note.id %}>View Note Details</a>
        <p>{{ note.content }}</p>
    {% endfor %}
{% endblock content %}
