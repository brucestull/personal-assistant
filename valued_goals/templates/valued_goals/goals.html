{% extends 'base.html' %}

{% block title %}Goals{% endblock title %}


{% block content %}
    <h1>Goals</h1>
    <a href="{% url 'valued_goals:goals-create' %}">Create a new goal</a>
    <hr>
    {% for goal in goals %}
    <a href="{% url 'valued_goals:goals-detail' goal.id %}"><h2>{{ goal.name }}</h2></a>
    <br>
    {{ goal.description }}
    <hr>
    {% endfor %}
{% endblock content %}
