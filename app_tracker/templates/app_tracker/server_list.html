{% extends "base.html" %}
{% block content %}
  <h1>Servers</h1>
  <a href="{% url 'app_tracker:server_create' %}">➕ Create New Server</a>
  <ul>
    {% for server in object_list %}
      <li>
        <a href="{% url 'app_tracker:server_detail' server.pk %}">
          {{ server.host_name }}
        </a>
      </li>
    {% empty %}
      <li>No Servers found.</li>
    {% endfor %}
  </ul>
{% endblock %}
